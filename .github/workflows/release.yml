name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck

  release:
    name: release
    needs: test
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.plan.outputs.release }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - id: plan
        run: node scripts/release-notes.mjs --github-output "$GITHUB_OUTPUT" --notes release/notes.md
      - name: Build the extension
        if: steps.plan.outputs.release == 'true'
        run: npm run build --workspace @muty/extension
      - name: Pack the store zip
        if: steps.plan.outputs.release == 'true'
        run: node scripts/package-chrome.mjs "${{ steps.plan.outputs.version }}"
      - name: Publish the GitHub Release
        if: steps.plan.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            echo "Release v${VERSION} already exists."
          else
            gh release create "v${VERSION}" \
              --title "Muty v${VERSION}" \
              --notes-file release/notes.md \
              "release/muty-chrome-v${VERSION}.zip" \
              release/SHA256SUMS.txt
          fi
      - name: Upload the store package
        if: steps.plan.outputs.release == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: chrome-package
          path: |
            release/muty-chrome-*.zip
            release/SHA256SUMS.txt
            release/version.txt
          if-no-files-found: error

  manifest:
    name: manifest
    needs: release
    if: needs.release.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Open the manifest pull request
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin development
          git checkout -B "chore/manifest-v${VERSION}" origin/development
          node --input-type=module -e "
            import { readFileSync, writeFileSync } from 'node:fs';
            const file = 'apps/extension/manifest.json';
            const manifest = JSON.parse(readFileSync(file, 'utf8'));
            manifest.version = process.env.VERSION;
            writeFileSync(file, JSON.stringify(manifest, null, 2) + '\n');
          "
          if git diff --quiet -- apps/extension/manifest.json; then
            echo "Manifest is already ${VERSION}."
            exit 0
          fi
          git add apps/extension/manifest.json
          git commit -m "chore(extension): set manifest to ${VERSION}"
          git push origin "chore/manifest-v${VERSION}"
          existing=$(gh pr list --base development --head "chore/manifest-v${VERSION}" --json number --jq 'length')
          if [ "$existing" != "0" ]; then
            echo "Manifest pull request already exists."
            exit 0
          fi
          gh pr create \
            --base development \
            --head "chore/manifest-v${VERSION}" \
            --title "chore(extension): set manifest to ${VERSION}" \
            --body "Sets the extension manifest to the version already submitted from main. This pull request targets development. It does not publish by itself."

  chrome-web-store:
    name: chrome-web-store
    needs: release
    if: needs.release.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: chrome-package
          path: release
      - name: Submit the package
        env:
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          CWS_EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
          VERSION: ${{ needs.release.outputs.version }}
        run: node scripts/publish-chrome.mjs "release/muty-chrome-v${VERSION}.zip"
